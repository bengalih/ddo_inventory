<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<h1>Login</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <p>
        <label>Username</label><br>
        <input
            type="text"
            name="username"
            required
        >
    </p>

    <p>
        <label>Password</label><br>
        <input
            type="password"
            name="password"
            required
        >
    </p>

    <button type="submit">
        Login
    </button>

</form>

<p>
    <a href="{{ url_for('register') }}">
        Create an account
    </a>
</p>

<p>
    <a href="{{ url_for('index') }}">
        Back
    </a>
</p>

</body>
</html>
