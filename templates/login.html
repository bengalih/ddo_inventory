<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<h1>Login</h1>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">

    <p>
        <label>Username</label><br>
        <input
            type="text"
            name="username"
            required
        >
    </p>

    <p>
        <label>Password</label><br>
        <input
            type="password"
            name="password"
            required
        >
    </p>

    <button type="submit">
        Login
    </button>

</form>

<p>
    <a href="{{ url_for('register') }}">
        Create an account
    </a>
</p>

<p>
    <a href="{{ url_for('index') }}">
        Back
    </a>
</p>

</body>
</html>
