{% extends "inventory/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

{% if form.non_field_errors %}
<p class="error">{{ form.non_field_errors.0 }}</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        <label>Username</label><br>
        <input
            type="text"
            name="username"
            required
            autofocus
        >
    </p>

    <p>
        <label>Password</label><br>
        <input
            type="password"
            name="password"
            required
        >
    </p>

    <button type="submit">
        Login
    </button>

</form>

<p>
    <a href="{% url 'register' %}">
        Create an account
    </a>
</p>

{% endblock %}
